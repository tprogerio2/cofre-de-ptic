<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela Inicial - Cofre</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #1f2937);
    }

    .container{
      text-align: center;
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    h1{
      margin-bottom: 20px;
      color: #111827;
    }

    a{
      text-decoration: none;
    }

    button{
      padding: 15px 35px;
      border: none;
      border-radius: 10px;
      background-color: #1b1b1b;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover{
      background-color: #000000;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="container">
    <img src="img/senku.png" alt="Senku" ></img>
    <h1>Cofre Digital</h1>

    <a href="Cofre.html">
      <button>Iniciar</button>
    </a>
  </div>

</body>
</html>
